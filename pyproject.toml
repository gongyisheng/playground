[project]
name = "playground"
version = "0.1.0"
description = "Personal monorepo for ML, systems, and full-stack experiments"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "torchaudio>=2.11.0",
    "triton>=3.7.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
